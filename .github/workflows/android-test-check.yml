name: Android unit test check

# android/src/test(Robolectric/JVMユニットテスト、`./gradlew :android:testDebugUnitTest`)を
# CIで実行する。既存のCIワークフロー(fdroid-build-check.yml/room-migration-check.yml)は
# どちらもgradleを呼んではいるが、実際にAndroidユニットテストを実行するジョブは
# これまで一つも存在しなかった(fdroid-build-check.ymlは`assembleRelease`のビルド確認のみ、
# room-migration-check.ymlはRoom migrationの版数整合性のみ)。
#
# Rust(NDKクロスビルド・isekai-pipe muslビルド)は一切不要: 以前は`preBuild`が
# `copyRustCoreJniLibs`→`cargoBuildRustCore`に依存していたため全gradleタスクが
# NDKクロスビルドを要求し、このjobもNDK/aarch64-linux-androidターゲット/musl
# isekai-pipeビルド(ジョブ時間の6〜7割、5〜10分)を準備していた。しかし2026-07-28に
# `android/build.gradle.kts`が`preBuild`依存をやめ、`merge*JniLibFolders`(APK
# パッケージング系)だけが`copyRustCoreJniLibs`に依存する形になって以降、
# `testDebugUnitTest`のタスクグラフにcargo系タスクは含まれない(2026-10-06の
# 実行ログで`cargoBuildRustCore`が一度も実行されていないことを確認済み。
# Robolectricテストはフェイク経由でネイティブ.soをロードしない。そもそも
# aarch64向け.soはx86_64のJVMにはロードできない)。準備ステップは純粋な
# 無駄だったので削除した。将来もし誰かが再びcargoを`testDebugUnitTest`の
# 依存に戻した場合は、cargo/NDKの準備が無いこのjobが**大きな音を立てて失敗する**
# (古い.soを黙って使うようなサイレントな誤りにはならない)ので、その時点で
# 準備ステップを戻すかどうかを判断すればよい。

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "rust-core/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-test-check.yml"
  # pull_requestではpaths:フィルタを使わない(2026-08、項目3 Phase2)。branch
  # protectionのrequired status checkにする際、path-filter付きpull_requestは
  # 対象パスに触れないPRでcheck-run自体が作られず恒久pendingになる。代わりに
  # 常時発火させ、`.github/actions/pr-path-gate`(下のjob参照)で無関係な変更を
  # 判定して重いステップだけスキップする。以前のpaths:リスト(pr-path-gateの
  # patternsと同義)は上のpush.pathsと同一だったものをそのまま維持している。
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # PRの再pushでは古い実行を捨てる。mainへのpushはcommit(sha)ごとに別groupにして、キャンセルも前の実行待ち
  # (macOSキューで数十分詰まる)もさせない。連続マージで合成状態の検証が
  # 毎回キャンセルされ、2026-10-06に5連続で未検証になった)。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # pr-path-gate呼び出しだけを行う軽量job(修正4、2026-08-17)。JDK/NDK/cargoの
  # セットアップは一切行わず、`test` jobをまるごとスキップするかどうかを
  # 一度だけ判定する。ジョブがskipされてもGitHub上のcheck-runは作られ、
  # conclusionは`skipped`になる——required status checkにおいて`skipped`は
  # `success`と同様にマージをブロックしないため、恒久pending対策としての効果は
  # 従来の「job常時実行+ステップ単位if」と変わらないまま、以前は~34ステップに
  # コピペされていた同一の`if:`条件文を1箇所(このjobの`if:`)に集約できる。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # pull_requestイベントでのみ意味を持つゲート。push/workflow_dispatchでは
      # PRのbase.shaが存在しないため、上のjob outputsで無条件relevant=trueとして
      # 扱う。
      - name: Determine PR relevance
        id: relevant
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-path-gate
        with:
          patterns: |
            ^android/
            ^rust-core/
            ^gradle/
            ^[^/]+\.gradle\.kts$
            ^gradle\.properties$
            ^settings\.gradle\.kts$
            ^\.github/workflows/android-test-check\.yml$
            ^\.github/actions/pr-path-gate/

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # branch protectionのrequired status checkのcontextとして使われている、
    # 変更時は同時にprotection設定も更新すること。
    name: android-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradleのキャッシュ(依存jar・wrapper・**ビルドキャッシュ**)はsetup-gradleに任せる
      # (以前の`setup-java`の`cache: gradle`は~/.gradle/caches全体を固定キーで
      # 保存するだけで、ビルドキャッシュも効かず、一度キーが当たると二度と更新
      # されなかった)。既定値どおり、キャッシュの書き込みはデフォルトブランチ(main)の
      # 実行だけで行い、PRの実行はmainのキャッシュを読むだけ(cache-read-only)。
      # configuration cacheは、runner間で持ち越すには暗号化キー(secret)が必要なので
      # 使わない。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew :android:testDebugUnitTest
        # `--build-cache`: kspDebugKotlin/compileDebugKotlin等のコンパイル系タスクを
        # mainのキャッシュから復元できるようにする(コマンドライン指定なのでローカル/
        # F-Droidビルドの挙動は変えない)。
        # `testDebugUnitTest --rerun`: テストタスク自体は入力が同一でもキャッシュ/
        # UP-TO-DATEで飛ばさず**毎回必ず実行**する(テストを実際に走らせることが
        # このjobの目的であり、フレーキーなテストの再現機会も失わないため)。
        run: ./gradlew :android:testDebugUnitTest --rerun --build-cache --stacktrace

      - name: Summarize test count and slowest test classes
        # CI時間の計測・テスト件数の回帰検知用(テストが黙って減っていないかを
        # job summaryで一目で確認できるようにする)。JUnit XMLを読むだけ。
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob("android/build/test-results/testDebugUnitTest/*.xml"):
              s = ET.parse(f).getroot()
              rows.append((float(s.get("time", 0)), s.get("name"), int(s.get("tests", 0)),
                           int(s.get("failures", 0)) + int(s.get("errors", 0)), int(s.get("skipped", 0))))
          rows.sort(reverse=True)
          print(f"### testDebugUnitTest: {len(rows)} classes, {sum(r[2] for r in rows)} tests, "
                f"{sum(r[3] for r in rows)} failed, {sum(r[4] for r in rows)} skipped, "
                f"{sum(r[0] for r in rows):.1f}s summed class time\n")
          print("| time (s) | class | tests |\n|---:|---|---:|")
          for t, n, c, _, _ in rows[:20]:
              print(f"| {t:.1f} | {n} | {c} |")
          PY

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/build/reports/tests/testDebugUnitTest
          retention-days: 7
