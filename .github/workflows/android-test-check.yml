name: Android unit test check

# android/src/test(Robolectric/JVMユニットテスト、`./gradlew :android:testDebugUnitTest`)を
# CIで実行する。既存のCIワークフロー(fdroid-build-check.yml/room-migration-check.yml)は
# どちらもgradleを呼んではいるが、実際にAndroidユニットテストを実行するジョブは
# これまで一つも存在しなかった(fdroid-build-check.ymlは`assembleRelease`のビルド確認のみ、
# room-migration-check.ymlはRoom migrationの版数整合性のみ)。
#
# 当初「Robolectricテストはフェイク経由でネイティブ.soのビルド不要」という前提で
# 書いたが、`android/build.gradle.kts`の`preBuild`(全タスクが依存する)が
# `copyRustCoreJniLibs`→`cargoBuildRustCore`(`cargo build --release --target
# aarch64-linux-android`)に依存しているため、`testDebugUnitTest`を含む
# **あらゆる**gradleタスクがこのNDKクロスビルドを要求する。したがって
# fdroid-build-check.ymlと同様、JDK・NDK(バージョンはfdroid recipe
# `fdroid/tools.isekai.terminal.yml`の`ndk:`と揃える)・
# `aarch64-linux-android`ターゲット・isekai-pipe muslバイナリ(`isekai_pipe_quic_transport.rs`の
# `include_bytes!`はターゲットを問わず無条件に要求する)の準備が必要。

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "rust-core/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-test-check.yml"
  # pull_requestではpaths:フィルタを使わない(2026-08、項目3 Phase2)。branch
  # protectionのrequired status checkにする際、path-filter付きpull_requestは
  # 対象パスに触れないPRでcheck-run自体が作られず恒久pendingになる。代わりに
  # 常時発火させ、`.github/actions/pr-path-gate`(下のjob参照)で無関係な変更を
  # 判定して重いステップだけスキップする。以前のpaths:リスト(pr-path-gateの
  # patternsと同義)は上のpush.pathsと同一だったものをそのまま維持している。
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # pr-path-gate(`gh pr diff`)がPRの変更ファイル一覧を読むために必要。
  pull-requests: read

jobs:
  test:
    # branch protectionのrequired status checkのcontextとして使われている、
    # 変更時は同時にprotection設定も更新すること。
    name: android-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pull_requestイベントでのみ意味を持つゲート。push/workflow_dispatchでは
      # `gh pr diff`が使えない(PR番号が無い)ため、無条件relevant=trueとして
      # 後続のif条件を素通りさせる。
      - name: Determine PR relevance
        id: relevant
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/pr-path-gate
        with:
          patterns: |
            ^android/
            ^rust-core/
            ^gradle/
            ^[^/]+\.gradle\.kts$
            ^gradle\.properties$
            ^settings\.gradle\.kts$
            ^\.github/workflows/android-test-check\.yml$
            ^\.github/actions/pr-path-gate/

      - name: Set up JDK 17
        if: github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache cargo (rust-core)
        if: github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: android-test-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            android-test-${{ runner.os }}-

      - name: Install the NDK version pinned by the F-Droid recipe
        # fdroid/tools.isekai.terminal.yml の`ndk:`と同じバージョンを使う
        # (android-arm64-clang.sh/android-arm64-ar.shが期待するツールチェーンと揃える)。
        if: github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true'
        run: |
          NDK_VERSION="$(grep -m1 '^\s*ndk:' fdroid/tools.isekai.terminal.yml | awk '{print $2}')"
          echo "Installing NDK $NDK_VERSION"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Add aarch64-linux-android rustup target
        if: github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true'
        run: rustup target add aarch64-linux-android

      - name: Build isekai-pipe musl binaries (build prerequisite for isekai-terminal-core)
        # rust-core/src/isekai_pipe_quic_transport.rs が include_bytes! で埋め込む
        # isekai-pipe の x86_64/aarch64 musl静的バイナリ。ターゲットに関わらず
        # isekai-terminal-coreをビルドするだけで常に必要(rust-core-test-check.yml/
        # ios-*-check.yml各ワークフロー参照)。
        if: github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          curl -fL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          mkdir -p "$HOME/zig-toolchain"
          tar xJf /tmp/zig.tar.xz --strip-components=1 -C "$HOME/zig-toolchain"
          echo "$HOME/zig-toolchain" >> "$GITHUB_PATH"
          export PATH="$HOME/zig-toolchain:$PATH"
          cargo install cargo-zigbuild --locked
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          bash rust-core/scripts/build-isekai-pipe-musl.sh

      - name: ./gradlew :android:testDebugUnitTest
        if: github.event_name != 'pull_request' || steps.relevant.outputs.relevant == 'true'
        run: ./gradlew :android:testDebugUnitTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/build/reports/tests/testDebugUnitTest
          retention-days: 7
