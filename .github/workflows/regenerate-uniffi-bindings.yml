name: Regenerate UniFFI bindings (on-demand)

# 手動実行専用: ローカルサンドボックスでcargo buildを一切行わずに、
# isekai-terminal-coreのUniFFI Kotlin/Swiftバインディングを再生成し、
# artifactとして出力する(ダウンロード後、呼び出し元がdiffを確認して
# 手動でコミットする想定。CI自身はpushしない)。
#
# ホストのデフォルトターゲット向けdebugビルド(target/debug/libisekai_terminal_core.so)
# だけで十分(uniffiの--library方式はコンパイル済みバイナリのメタデータを読むだけで、
# Android/iOS向けクロスビルドは不要。rust-core/scripts/generate-swift-bindings.sh参照)。
# ただしisekai_pipe_quic_transport.rsがLinux musl静的バイナリをinclude_bytes!で
# 無条件に埋め込むため、build-isekai-pipe-musl.shは他ワークフロー同様に先に必要。

on:
  workflow_dispatch:

concurrency:
  group: regenerate-uniffi-bindings-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo (rust-core)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust-core/target
          key: regenerate-uniffi-bindings-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            regenerate-uniffi-bindings-${{ runner.os }}-

      - name: Install zig (mlugg/setup-zig)
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Update Cargo.lock for the noq fork (targeted, not a full re-resolution)
        working-directory: rust-core
        # `cargo generate-lockfile`(フル再解決)はnoqと無関係な依存まで大量に
        # バージョンが動いてしまうため使わない。`-p noq -p cfg_aliases`で対象を
        # 絞る: noq自体の切り替えに加えて、forkのnoq(cfg_aliases要求^0.2.2)と
        # quinn(isekai-pipeのquinn互換確認コード経由、cfg_aliases要求^0.2)が
        # 旧lockのcfg_aliases 0.2.1固定と衝突するため、cfg_aliasesも明示的に
        # 対象に含める(両者は本来semver互換だが、対象外にすると再解決されない)。
        run: cargo update -p noq -p cfg_aliases

      - name: Build isekai-pipe musl binaries (build prerequisite for isekai-terminal-core)
        run: |
          set -euo pipefail
          if ! command -v cargo-zigbuild >/dev/null; then
            cargo install cargo-zigbuild --locked
          fi
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          bash rust-core/scripts/build-isekai-pipe-musl.sh

      - name: Build isekai-terminal-core (host debug)
        working-directory: rust-core
        run: cargo build -p isekai-terminal-core

      - name: Generate Kotlin bindings
        working-directory: rust-core
        run: |
          rm -rf ../android/src/main/kotlin/uniffi/isekai_terminal_core
          cargo run -p uniffi-bindgen -- generate \
            --library target/debug/libisekai_terminal_core.so \
            --language kotlin \
            --out-dir ../android/src/main/kotlin

      - name: Generate Swift bindings
        run: bash rust-core/scripts/generate-swift-bindings.sh

      - name: Upload generated Kotlin bindings
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-kotlin-bindings
          path: android/src/main/kotlin/uniffi/isekai_terminal_core/
          retention-days: 7

      - name: Upload generated Swift bindings
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-swift-bindings
          path: ios/Sources/IsekaiTerminalCoreLogic/generated/
          retention-days: 7

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: rust-core/Cargo.lock
          retention-days: 7
