name: cargo-mutants sweep (on-demand)

# 手動実行専用: rust-core の指定crate/ファイルに対して cargo-mutants の全ミュータント
# 走査を行い、missed/caught一覧をartifactとして出力する。push/PR毎には走らせない
# (全ミュータント走査は数十分〜数時間かかり得るため、既存の必須チェック
# [rust-core-test-check.yml等]とは別枠)。
#
# runner_type で実行環境を選べる:
#   - self-hosted-gcp-spot(既定): cargo-ci-gcp-spot-instanceスキル(~/.claude/skills/
#     cargo-ci-gcp-spot-instance)で用意したGCP Spot VMをephemeral self-hosted runner
#     として登録して使う(事前にrunner登録が必要、詳細はそのスキルのSKILL.md参照)。
#     VMは毎回新規作成(永続ディスク・キャッシュ無し)なのでツールチェーンは毎回導入する
#     が、GitHub-hostedのjob時間制限を気にせず全ミュータント走査のような重いジョブを
#     回せる。
#   - github-hosted: GitHub-hosted ubuntu-latest。依存インストールを毎回行うため
#     大きなcrate/broadなfilterでは非現実的だが、狭いfilter(1関数程度)での
#     動作確認には使える。
#
# isekai-terminal-core は isekai-pipe の musl 静的バイナリ(x86_64/aarch64)を
# include_bytes! でソースに埋め込む設計のため、cargo mutantsのbaseline buildより前に
# scripts/build-isekai-pipe-musl.sh を必ず実行する(build-android.ymlと同じ手法)。
# --copy-target true も、cargo-mutantsのスクラッチビルドディレクトリに既存のtarget/
# (=musl埋め込みバイナリ)を含めるために必須。

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: "実行環境"
        type: choice
        options:
          - self-hosted-gcp-spot
          - github-hosted
        default: self-hosted-gcp-spot
      package:
        description: "cargo mutants -p の対象crate"
        type: string
        default: isekai-terminal-core
      file_filter:
        description: "cargo mutants -f の対象ファイル(相対パス、正規表現)。空なら全体を走査する"
        type: string
        default: orchestrator.rs
      extra_args:
        description: "cargo mutantsへ追加で渡す引数(任意)"
        type: string
        default: ""

concurrency:
  group: cargo-mutants-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ${{ inputs.runner_type == 'self-hosted-gcp-spot' && fromJSON('["self-hosted", "gcp-spot"]') || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # self-hosted-gcp-spotのVMは使うたびに新規作成され、永続ディスクもキャッシュも
      # 持たない(2026-10、PD課金対策。cargo-ci-gcp-spot-instanceスキル参照)。
      # github-hostedと同じ手順でツールチェーンを毎回導入する(Rust/zig/cargo-*は
      # 合計1〜2分程度で、キャッシュの有無による差は実測で約1分だった)。
      # 唯一の差分は、素のDebianにはcc(cargo-zigbuild等のbuild.rsが要求)が無い点。
      # ciuserにはNOPASSWD sudoが与えられている。
      - name: Install build-essential (self-hosted only)
        if: inputs.runner_type == 'self-hosted-gcp-spot'
        run: |
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq build-essential
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Cache Cargo (github-hosted only)
        if: inputs.runner_type != 'self-hosted-gcp-spot'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            rust-core/target
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            cargo-mutants-${{ runner.os }}-

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # cargo-mutantsの事前ビルド済みgnuバイナリはglibc 2.39を要求し、self-hosted VM
      # (Debian 12、glibc 2.36)では動かない。ソースからインストールする(32コアで約26秒)。
      - name: Install cargo-mutants (if missing)
        run: |
          if ! command -v cargo-mutants >/dev/null; then
            cargo install cargo-mutants --locked
          fi

      - name: Build musl isekai-pipe (embedded via include_bytes! in isekai-terminal-core)
        working-directory: rust-core
        run: ./scripts/build-isekai-pipe-musl.sh

      - name: Run cargo mutants
        working-directory: rust-core
        run: |
          rm -rf mutants.out mutants.out.old
          FILTER_ARGS=()
          if [ -n "${{ inputs.file_filter }}" ]; then
            FILTER_ARGS=(-f "${{ inputs.file_filter }}")
          fi
          cargo mutants -p "${{ inputs.package }}" "${FILTER_ARGS[@]}" \
            --jobs 8 --copy-target true ${{ inputs.extra_args }}

      - name: Summarize outcome
        if: always()
        working-directory: rust-core
        run: |
          if [ -f mutants.out/outcomes.json ]; then
            echo "### cargo-mutants summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            wc -l mutants.out/missed.txt mutants.out/caught.txt mutants.out/unviable.txt mutants.out/timeout.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ inputs.package }}
          path: rust-core/mutants.out/
          retention-days: 14
