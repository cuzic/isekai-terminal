name: cargo-mutants sweep (on-demand)

# 手動実行専用: rust-core の指定crate/ファイルに対して cargo-mutants の全ミュータント
# 走査を行い、missed/caught一覧をartifactとして出力する。push/PR毎には走らせない
# (全ミュータント走査は数十分〜数時間かかり得るため、既存の必須チェック
# [rust-core-test-check.yml等]とは別枠)。
#
# runner_type で実行環境を選べる:
#   - self-hosted-gcp-spot(既定): cargo-ci-gcp-spot-instanceスキル(~/.claude/skills/
#     cargo-ci-gcp-spot-instance)で用意したGCP Spot VMをephemeral self-hosted runner
#     として登録して使う(事前にrunner登録が必要、詳細はそのスキルのSKILL.md参照)。
#     ツールチェーン・cargo依存・musl埋め込みバイナリが永続ディスクに常駐しているため、
#     依存インストールが丸ごと不要になり、GitHub-hostedのjob時間制限を気にせず
#     全ミュータント走査のような重いジョブを回せる。
#   - github-hosted: GitHub-hosted ubuntu-latest。依存インストールを毎回行うため
#     大きなcrate/broadなfilterでは非現実的だが、狭いfilter(1関数程度)での
#     動作確認には使える。
#
# isekai-terminal-core は isekai-pipe の musl 静的バイナリ(x86_64/aarch64)を
# include_bytes! でソースに埋め込む設計のため、cargo mutantsのbaseline buildより前に
# scripts/build-isekai-pipe-musl.sh を必ず実行する(build-android.ymlと同じ手法)。
# --copy-target true も、cargo-mutantsのスクラッチビルドディレクトリに既存のtarget/
# (=musl埋め込みバイナリ)を含めるために必須。

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: "実行環境"
        type: choice
        options:
          - self-hosted-gcp-spot
          - github-hosted
        default: self-hosted-gcp-spot
      package:
        description: "cargo mutants -p の対象crate"
        type: string
        default: isekai-terminal-core
      file_filter:
        description: "cargo mutants -f の対象ファイル(相対パス、正規表現)。空なら全体を走査する"
        type: string
        default: orchestrator.rs
      extra_args:
        description: "cargo mutantsへ追加で渡す引数(任意)"
        type: string
        default: ""

concurrency:
  group: cargo-mutants-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ${{ inputs.runner_type == 'self-hosted-gcp-spot' && fromJSON('["self-hosted", "gcp-spot"]') || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # ── self-hosted-gcp-spot専用: 永続ディスク側のキャッシュ済み環境を指す
      #    環境変数を$GITHUB_ENVへ書く(/etc/environmentのソースだけでは子プロセスに
      #    exportされない不具合を過去に踏んでいるため、cargo-ci-gcp-spot-instance
      #    スキル参照。GitHub Actions自体が保証する$GITHUB_ENV/$GITHUB_PATHの
      #    伝播機構を使い同じ地雷を避ける)。複数リポジトリがこのVMを使い回すため
      #    リポジトリ名をサブパスに含める(同スキルの「複数プロジェクトでの共有」節参照)。
      - name: Point at persistent-disk toolchain caches (self-hosted only)
        if: inputs.runner_type == 'self-hosted-gcp-spot'
        run: |
          echo "CARGO_HOME=/mnt/cache/cargo-home-isekai-terminal" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/mnt/cache/rustup-home-isekai-terminal" >> "$GITHUB_ENV"
          echo "/mnt/cache/cargo-home-isekai-terminal/bin" >> "$GITHUB_PATH"
          echo "/mnt/cache/zig" >> "$GITHUB_PATH"

      # rust-core/targetはinclude_bytes!がCARGO_MANIFEST_DIRからの相対パスを
      # ハードコードしているため、CARGO_TARGET_DIRでは永続化できない
      # (cargo-ci-gcp-spot-instanceスキル参照)。actions/checkoutで作られる
      # 毎回新しいワークスペースの中で、都度シンボリックリンクを張り直す。
      - name: Symlink rust-core/target to persistent cache (self-hosted only)
        if: inputs.runner_type == 'self-hosted-gcp-spot'
        run: |
          mkdir -p /mnt/cache/target-isekai-terminal-gha-runner
          rm -rf rust-core/target
          ln -sfn /mnt/cache/target-isekai-terminal-gha-runner rust-core/target

      - name: Install Rust toolchain (github-hosted only)
        if: inputs.runner_type != 'self-hosted-gcp-spot'
        uses: dtolnay/rust-toolchain@stable

      # self-hosted-gcp-spotの永続ディスク(/mnt/cache)にはRust/Android等の
      # 言語ツールチェーンは一切プリインストールされない設計(汎用「素のコンピュート」
      # というcargo-ci-gcp-spot-instanceスキルの方針、SKILL.md参照)。dtolnay/
      # rust-toolchainはCARGO_HOME/RUSTUP_HOMEをrustupの既定パスに戻してしまうため
      # 使わず、rustup公式スクリプトを直接、永続ディスク上のCARGO_HOME/RUSTUP_HOMEへ
      # 手動インストールする(既に入っていれば`command -v`でスキップし高速化する)。
      - name: Install Rust toolchain (self-hosted only, idempotent on persistent disk)
        if: inputs.runner_type == 'self-hosted-gcp-spot'
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --no-modify-path
          fi

      - name: Add musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install zig (github-hosted only)
        if: inputs.runner_type != 'self-hosted-gcp-spot'
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      # zigも同様に永続ディスクへ直接展開する(mlugg/setup-zigはランナーの一時領域に
      # 展開するため、instance再作成のたびに再ダウンロードが必要になってしまう)。
      - name: Install zig (self-hosted only, idempotent on persistent disk)
        if: inputs.runner_type == 'self-hosted-gcp-spot'
        run: |
          if ! command -v zig >/dev/null; then
            ZIG_VERSION=0.13.0
            curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
              | tar -xJ -C /mnt/cache
            mv "/mnt/cache/zig-linux-x86_64-${ZIG_VERSION}" /mnt/cache/zig
          fi

      - name: Cache Cargo (github-hosted only)
        if: inputs.runner_type != 'self-hosted-gcp-spot'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            rust-core/target
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            cargo-mutants-${{ runner.os }}-

      - name: Install cargo-zigbuild (if missing)
        run: |
          if ! command -v cargo-zigbuild >/dev/null; then
            cargo install cargo-zigbuild
          fi

      - name: Install cargo-mutants (if missing)
        run: |
          if ! command -v cargo-mutants >/dev/null; then
            cargo install cargo-mutants --locked
          fi

      - name: Build musl isekai-pipe (embedded via include_bytes! in isekai-terminal-core)
        working-directory: rust-core
        run: ./scripts/build-isekai-pipe-musl.sh

      - name: Run cargo mutants
        working-directory: rust-core
        run: |
          rm -rf mutants.out mutants.out.old
          FILTER_ARGS=()
          if [ -n "${{ inputs.file_filter }}" ]; then
            FILTER_ARGS=(-f "${{ inputs.file_filter }}")
          fi
          cargo mutants -p "${{ inputs.package }}" "${FILTER_ARGS[@]}" \
            --jobs 8 --copy-target true ${{ inputs.extra_args }}

      - name: Summarize outcome
        if: always()
        working-directory: rust-core
        run: |
          if [ -f mutants.out/outcomes.json ]; then
            echo "### cargo-mutants summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            wc -l mutants.out/missed.txt mutants.out/caught.txt mutants.out/unviable.txt mutants.out/timeout.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-${{ inputs.package }}
          path: rust-core/mutants.out/
          retention-days: 14
