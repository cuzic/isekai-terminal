[package]
name = "isekai-trust"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2.0.18"
# 0600/0700 permission + world-writable checks, shared with isekai-auth's
# token file (see isekai-fs-guard's crate docs).
isekai-fs-guard = { path = "../isekai-fs-guard" }
# host_key_verifier.rs: implements russh_stream_session::HostKeyVerifier,
# runs the blocking locked-store I/O on tokio's blocking pool, and logs
# mismatch/failure context.
russh-stream-session = { path = "../russh-stream-session" }
async-trait = "0.1.89"
tokio = { version = "1", features = ["rt"] }
log = "0.4"
# encoding.rs::hex_sha256, shared by isekai-ssh/isekai-bootstrap's own
# hex_sha256 call sites (see that module's docs).
sha2 = "0.10"
# `HelperTrust::cached_session_secret`をdrop時にゼロ化するために使う
# (`schema.rs`の`impl Drop for HelperTrust`)。この秘密自体は`known_helpers.toml`に
# 平文base64のまま永続化される設計のため防げる範囲は限定的だが、`isekai-auth::TokenSet`
# と対策の対称性を取る(2026-07-28、書籍原稿の実地検証で発覚した非対称性の是正)。
zeroize = "1"

[dev-dependencies]
# host_key_verifier.rs tests need the multi-thread runtime + timers to prove
# a pending new-host confirmation doesn't block a different host's check.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Test-only scratch directory factory now that store.rs's own atomic-write
# body moved into isekai-fs-guard::write_private_atomically (WU-M3).
tempfile = "3"
