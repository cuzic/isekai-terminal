[workspace]
members = [".", "uniffi-bindgen", "h3-noq", "h3-qmux", "isekai-link-masque", "isekai-stun", "isekai-protocol", "isekai-fs-guard", "isekai-trust", "isekai-auth", "isekai-transport", "isekai-bootstrap", "isekai-bootstrap-plan", "isekai-ssh", "isekai-pipe-protocol", "isekai-pipe-core", "isekai-pipe", "isekai-netmon", "quicsock", "quicmux", "russh-stream-session", "openssh-config", "local-ipc-mux", "osc-color", "claude-hookd"]
resolver = "2"

# noq-multipath-spike(実機検証用の使い捨てコード、CLAUDE.md参照)は意図的に
# workspace memberから外している。`.workspace = true`でどの依存も継承していない
# 独立クレートのため、`cd noq-multipath-spike && cargo build`(または
# `--manifest-path`指定)で単体ビルドできる。以前はmembersに含めたまま
# `cargo build/test --workspace`側で個別に`--exclude noq-multipath-spike`する
# 運用だったが、通常のworkspace操作の対象から外すこと自体が目的(Codex
# アーキテクチャレビュー指摘)なので、member登録自体をやめて誤操作を防ぐ。

# quicsock(/home/cuzic/quicsockからvendor。isekai-transportへのマルチパス移植の
# うち、物理インタフェース束縛層 — `isekai-transport::physical_interface`)は
# `*.workspace = true`でこれらを継承する。vendor元のCargo.tomlをそのまま保つ
# ための最小限のセクションで、既存クレートはどれもこれを参照していない。
# (quicsock-noqも同時にvendorしていたが、それが要る「同一QUIC接続で複数の
# 物理インタフェースを同時保持する」方式はnoq issue #738で断念済みのため
# 未使用のまま残さず削除した — isekai-transport/src/multipath.rsのdoc参照。)

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuzic/quicsock"

# `noq`をcrates.io版から`cuzic/noq`のfork(noq#738のmultipath address-family正規化
# fix、upstream PR https://github.com/n0-computer/noq/pull/784としてレビュー中)へ
# 切り替え。upstreamのレビューサイクルを待たずにこのfixを取り込むため。`branch`では
# なく特定commitへの`rev`固定にしているのは、PRが今後もレビュー対応で更新され続ける
# ため、ビルドが知らないうちに変わらないようにするため。upstream本流の変更を取り込む
# 際はnoq自身のCONTRIBUTING.mdが文書化している手順(`git fetch upstream main` →
# 差分をcherry-pickしてこのforkに反映 → ここの`rev`を更新)を踏襲する。
[workspace.dependencies]
noq = { git = "https://github.com/cuzic/noq.git", rev = "db998f2dd883d15d763f8f32147f3c903ca88667" }

[package]
name = "isekai-terminal-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "isekai_terminal_core"
crate-type = ["cdylib", "staticlib"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["test-util"] }

[dependencies]
rand = "0.8"
uniffi = { version = "0.31", features = ["tokio"] }
timed-fsm = { version = "0.4.0", features = ["tokio"] }
russh = "0.48"
russh-keys = "0.48"
russh-stream-session = { path = "russh-stream-session" }
tokio = { version = "1", features = ["full"] }
log = "0.4"
parking_lot = "0.12"
smol_str = "0.2"
thiserror = "2.0.18"
async-trait = "0.1.89"
vte = "0.13"
unicode-width = "0.1"
base64 = "0.22"
flate2 = "1"
# Kitty graphics(#53): f=100(PNG転送形式)のデコード用。純Rust実装
# (miniz_oxide/fdeflate/crc32fast — いずれも既にツリーにあり、Cで書かれた
# バインディングを持たないためAndroid向けクロスコンパイルも他と同様に通る)。
# chafa --format=kitty / kitty +kitten icat 等の実ツールが既定でPNGを送るため、
# 生RGBA(f=32/24)だけでは実用的な互換性が得られない(kitty_graphics.rsのモジュール
# doc「実装範囲」参照)。
png = "0.17"
md5 = "0.8"
# タスク#65: パスワード・復号済み秘密鍵PEMを、使い終わった時点で明示的にゼロ化する
# ために使う(`src/transport/ssh_handler.rs`の`zeroize_ssh_auth()`。`SshAuth`はUniFFI
# 公開enumのためDrop実装や`Zeroizing<_>`は使えず、呼び出し側から明示的に呼ぶ方式)。
zeroize = "1"
# QUIC実装は noq（quinnのマルチパスフォーク）に一本化している。
# helper_quic_transport.rs（Phase 7/8、単一パス）・quic_transport.rs（Phase 5B）・
# resume_client.rs も含め、quinn は使っていない
# （Phase 9-0/9-1 でquinnクライアント⇔noqサーバーの後方互換を実証済みなので、
# noqは単一パス用途でも quinn と相互接続可能）。
noq = { workspace = true, features = ["rustls", "ring"] }
tokio-stream = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
isekai-stun = { path = "isekai-stun" }
# Phase S-0f: HELLO/proof/ACK・handshake JSON の型は isekai-protocol (pure crate)
# を SSOT にする。ISEKAI_SSH_DESIGN.md「共有ロジックの crate 分割」参照。
isekai-protocol = { path = "isekai-protocol" }
# Phase 2c(isekai-terminal-core/isekai-ssh crate共有化): クライアント側STUN candidate
# 収集ロジック(client_candidates::fresh_bootstrap_request_v2)をisekai-ssh CLIと共有する。
# isekai-bootstrapはisekai-terminal-core/UniFFI/Android専用型に一切依存しないpure寄りの
# crateなので、この一方向依存は循環しない。
isekai-bootstrap = { path = "isekai-bootstrap" }
# Phase 1b(isekai-terminal-core/isekai-transport crate共有化): QUIC接続確立/resume
# ロジックの共有先。android_quic_endpoint.rsがQuicEndpointFactory等のtraitを
# FaultyUdpSocket向けに実装し、Phase 1cで実際の接続経路(quic/relay/stun_p2p)を
# これ経由に置き換える。isekai-transportはisekai-terminal-core/UniFFI/Android専用型に
# 一切依存しないpure寄りのcrateなので、この一方向依存は循環しない。
isekai-transport = { path = "isekai-transport" }
# quicmux抽出(isekai-transportからnoq/qmux backend抽象を切り出したleaf crate)後、
# android_quic_endpoint.rsが自前でtrait実装するのではなく`quicmux::AnyMuxFactory`/
# `AnyMuxConnection`のNoqバリアントを直接組み立てる形に置き換えた。isekai-transportと
# 同じ理由でこの一方向依存は循環しない(quicmuxはisekai-terminal-core/isekai-transport/
# isekai-protocolのいずれにも依存しない)。
quicmux = { path = "quicmux", features = ["noq"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[profile.release]
# `panic = "abort"`はisekai-ssh/isekai-pipeのリリースバイナリが想定より大きかった
# 調査から一時追加していたが、2026-07-25に撤去した。`isekai-pipe serve`
# (`isekai-pipe/src/engine/mod.rs`の`tokio::spawn(handle_incoming)`)も
# isekai-sshのControlPersist mux holder(`isekai-ssh/src/native/mux/owner.rs`の
# `serve_clients`/`relay_client`)も、1セッションごとに個別の`tokio::spawn`で
# 隔離する設計になっている。tokioのこの隔離は`panic = "unwind"`(既定)が前提
# ——1タスクのpanicは`JoinHandle`の`JoinError`として局所化されるだけで済むはずが、
# `panic = "abort"`下では隔離が効かずプロセス全体が即abortしていた
# (長時間使用中に低頻度のpanicを1回踏むだけでisekai-ssh全体が落ちる原因の
# 最有力仮説として特定)。`uniffi_core`はFFI呼び出しを`catch_unwind`で包む設計
# ([uniffi_core::ffi::rustcalls])なので、`isekai-terminal-core`のcdylib/Android
# 側でこの変更がFFI境界越しのUBを新たに生むことはない。
strip = true
lto = true
codegen-units = 1
