[package]
name = "isekai-auth"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
# 0600/0700 permission + world-writable checks, shared with isekai-trust's
# trust store (see isekai-fs-guard's crate docs).
isekai-fs-guard = { path = "../isekai-fs-guard" }
# Device Authorization Grant (RFC 8628, `device_flow.rs`) and refresh_token
# (RFC 6749 §6, `refresh.rs`) HTTP calls, and `FileTokenProvider::get_relay_jwt`'s
# transparent refresh (`oauth.rs`). Chosen over reqwest/hyper: `TokenProvider`
# is a plain sync `fn` (see lib.rs docs), `isekai-ssh login` only ever needs
# one blocking request in flight, and ureq's default features (rustls+ring,
# gzip via flate2) reuse TLS/compression backends already present elsewhere
# in this workspace (isekai-transport, isekai-terminal-core) rather than pulling in a
# second async HTTP stack just for a handful of sequential POSTs.
ureq = "3"
# `TokenSet`(access_token/refresh_token)をdrop時にゼロ化するために使う
# (`file_provider.rs`の`impl Drop for TokenSet`)。ルートクレートの`SshAuth`が
# 同じzeroizeで明示呼び出し方式なのに対し、こちらはUniFFI公開型ではないため
# Drop方式を採れる(2026-07-28、書籍原稿の実地検証で発覚した非対称性の是正)。
zeroize = "1"

[dev-dependencies]
# Test-only scratch directory factory now that file_provider.rs's own
# atomic-write body moved into isekai-fs-guard::write_private_atomically
# (WU-M3).
tempfile = "3"
