# 純粋モジュール(rust-core/pure_modules.toml)の純粋性を検査するための
# clippy `disallowed-methods` / `disallowed-types` 設定。
# docs/adr/0019-functional-core-effects.md §2.3 参照。
#
# これらのlintは、各純粋モジュールの先頭の
#   #![deny(clippy::disallowed_methods, clippy::disallowed_types)]
# によってのみ error になる。CIは `cargo clippy --workspace --lib --bins -- -A clippy::all`
# で走らせるため、ソース内のdenyが優先され、純粋モジュール以外の既存コードは検査されない。
#
# `allow-invalid = true`: `parking_lot`/`rand`/`tokio`等を依存に持たないcrateでは
# パスが解決できず、設定レベルの警告(-A clippy::all では消えない)が出るのを防ぐ。
# (ADR §10 Q14)

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "時計読み。Millisを引数で受ける(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::time::Instant::elapsed", reason = "時計読み(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::time::SystemTime::now", reason = "時計読み(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::time::Instant::now", reason = "時計読み(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::time::sleep", reason = "タイマーはEffectとして宣言する(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::spawn", reason = "タスク生成はshellの責務(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::task::spawn_blocking", reason = "タスク生成はshellの責務(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::thread::spawn", reason = "スレッド生成はshellの責務(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::thread::sleep", reason = "待機はshellの責務(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "rand::thread_rng", reason = "RNGはshellから注入する(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "rand::random", reason = "RNGはshellから注入する(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::env::var", reason = "環境変数はshellが読む(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::process::Command::new", reason = "プロセス起動はshellの責務(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
]

disallowed-types = [
    { path = "std::sync::Mutex", reason = "ロックは集約shellが持つ(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::RwLock", reason = "同左(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "parking_lot::Mutex", reason = "同左(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::sync::Mutex", reason = "同左(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::sync::Notify", reason = "通知はshellの責務(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::fs::File", reason = "I/O型(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::net::UdpSocket", reason = "I/O型(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::net::TcpStream", reason = "I/O型(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::net::TcpStream", reason = "I/O型(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "rand::rngs::OsRng", reason = "RNGはshellから注入する(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "rand::rngs::ThreadRng", reason = "RNGはshellから注入する(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::time::Instant", reason = "時計型。Millisを使う(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "tokio::time::Instant", reason = "時計型。Millisを使う(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "timed_fsm::clock::MonotonicClock", reason = "now_ms()が内部でInstant::now()を読む(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "parking_lot::RwLock", reason = "グローバル可変状態(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::LazyLock", reason = "グローバル可変状態(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::OnceLock", reason = "グローバル可変状態(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::thread::LocalKey", reason = "thread_local!によるグローバル可変状態(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::atomic::AtomicBool", reason = "グローバル可変状態になりうる(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::atomic::AtomicU32", reason = "同左(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::atomic::AtomicU64", reason = "同左(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
    { path = "std::sync::atomic::AtomicUsize", reason = "同左(純粋モジュール用、docs/adr/0019-functional-core-effects.md §2.3)", allow-invalid = true },
]
